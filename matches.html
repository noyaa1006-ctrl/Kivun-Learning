<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>המורים באתר — כיוון</title>

  <link rel="stylesheet" href="styles.css">
  <script src="app.js"></script>
</head>

<body>
  <script>
    nav("matches");
  </script>

  <main class="container">
    <header class="page-head">
      <span class="eyebrow">הקהילה של כיוון</span>

      <h1>המורים באתר</h1>

      <p class="muted">
        כאן מופיעים רק פרופילים שמורים יצרו בעצמם
        דרך האתר.
      </p>
    </header>

    <section id="results"></section>
  </main>

  <script>
    const teachers = Kivun.teachers();

    const results =
      document.getElementById("results");

    if (teachers.length === 0) {
      results.innerHTML = `
        <div class="card empty">
          <div class="empty-icon">◎</div>

          <h2>עדיין אין מורים רשומים</h2>

          <p class="muted">
            לא נציג כאן מורים, דירוגים או ביקורות
            לדוגמה. כשהמורים הראשונים יפתחו פרופיל,
            הם יופיעו בעמוד הזה.
          </p>

          <a class="button teal" href="join.html">
            פתיחת פרופיל מורה
          </a>
        </div>
      `;
    } else {
      results.className = "teacher-grid";

      results.innerHTML = teachers
        .map((teacher) => {
          const name = Kivun.esc(teacher.name);
          const subject = Kivun.esc(
            teacher.subject
          );

          const bio = Kivun.esc(
            teacher.bio
          );

          const price = Kivun.esc(
            teacher.price
          );

          const initial = Kivun.esc(
            teacher.name.charAt(0)
          );

          const status = teacher.verified
            ? "מורה מאומת/ת"
            : "ממתין/ה לאימות";

          const profileLink =
            "teacher-profile.html?id=" +
            encodeURIComponent(teacher.id);

          return `
            <article class="card teacher-card">
              <div class="avatar">
                ${initial}
              </div>

              <div>
                <span class="tag">
                  ${status}
                </span>

                <h2>${name}</h2>

                <p class="muted">
                  ${subject}
                </p>

                <p>${bio}</p>

                ${
                  price
                    ? `
                      <p class="price">
                        ₪${price} לשעה
                      </p>
                    `
                    : `
                      <p class="muted">
                        המחיר טרם צוין
                      </p>
                    `
                }

                <a
                  class="button light"
                  href="${profileLink}"
                >
                  לפרופיל המלא ←
                </a>
              </div>
            </article>
          `;
        })
        .join("");
    }

    footer();
  </script>
</body>
</html>
