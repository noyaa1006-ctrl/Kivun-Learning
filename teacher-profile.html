<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>פרופיל מורה — כיוון</title>

  <link rel="stylesheet" href="styles.css">
  <script src="app.js"></script>
</head>

<body>
  <script>
    nav();
  </script>

  <main class="container">
    <header class="page-head">
      <a href="matches.html">
        ← חזרה לרשימת המורים
      </a>
    </header>

    <section id="profile"></section>
  </main>

  <script>
    const parameters =
      new URLSearchParams(window.location.search);

    const teacherId =
      parameters.get("id");

    const teacher = Kivun
      .teachers()
      .find((item) => item.id === teacherId);

    const profile =
      document.getElementById("profile");

    if (!teacher) {
      profile.innerHTML = `
        <div class="card empty">
          <div class="empty-icon">◎</div>

          <h1>הפרופיל לא נמצא</h1>

          <p class="muted">
            ייתכן שהמורה עדיין לא יצר/ה פרופיל,
            שהפרופיל הוסר או שהקישור אינו תקין.
          </p>

          <a class="button" href="matches.html">
            לרשימת המורים
          </a>
        </div>
      `;
    } else {
      const name = Kivun.esc(
        teacher.name
      );

      const initial = Kivun.esc(
        teacher.name.charAt(0)
      );

      const subject = Kivun.esc(
        teacher.subject
      );

      const bio = Kivun.esc(
        teacher.bio
      );

      const experience = Kivun.esc(
        teacher.experience || "טרם צוין"
      );

      const format = Kivun.esc(
        teacher.format || "אופן השיעור טרם צוין"
      );

      const price = Kivun.esc(
        teacher.price
      );

      const verificationStatus =
        teacher.verified
          ? "מורה מאומת/ת"
          : "ממתין/ה לאימות";

      profile.innerHTML = `
        <div class="profile-head">
          <div class="avatar">
            ${initial}
          </div>

          <div>
            <span class="tag">
              ${verificationStatus}
            </span>

            <h1>${name}</h1>

            <p class="muted">
              ${subject} · ${format}
            </p>
          </div>
        </div>

        <div class="profile-layout">
          <article class="card">
            <h2>קצת עליי</h2>

            <p>${bio}</p>

            <h2>ניסיון בהוראה</h2>

            <p>${experience}</p>

            <h2>המקצוע העיקרי</h2>

            <p>${subject}</p>

            <h2>אופן השיעור</h2>

            <p>${format}</p>
          </article>

          <aside class="card">
            <h2>פרטי השיעור</h2>

            ${
              price
                ? `
                  <p class="price">
                    ₪${price} לשעה
                  </p>
                `
                : `
                  <p class="muted">
                    המחיר טרם צוין
                  </p>
                `
            }

            <p class="muted">
              פרופיל זה נוצר על ידי המשתמש/ת.
              סימון אימות יוצג רק לאחר בדיקה אמיתית
              של פרטי המורה.
            </p>

            <div class="notice">
              אפשרות לשליחת הודעות ולקביעת שיעור
              תתווסף לאחר חיבור האתר למערכת
              משתמשים מאובטחת.
            </div>

            <a class="button light" href="matches.html">
              למורים נוספים
            </a>
          </aside>
        </div>
      `;
    }

    footer();
  </script>
</body>
</html>
