<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>פתיחת פרופיל — כיוון</title>

  <link rel="stylesheet" href="styles.css">
  <script src="app.js"></script>
</head>

<body>
  <script>
    nav();
  </script>

  <main class="container">
    <header class="page-head">
      <span class="eyebrow">מצטרפים לכיוון</span>

      <h1>פותחים פרופיל אמיתי</h1>

      <p class="muted">
        הפרטים שתזינו כאן הם הפרטים שיופיעו באתר.
      </p>
    </header>

    <section class="card form-card">
      <div class="role-picker">
        <button
          class="role-option active"
          data-role="student"
          type="button"
        >
          <strong>תלמיד/ה או הורה</strong>
          <br>

          <span class="muted">
            מחפשים מורה מתאים
          </span>
        </button>

        <button
          class="role-option"
          data-role="teacher"
          type="button"
        >
          <strong>מורה/מדריך/ה</strong>
          <br>

          <span class="muted">
            מציגים פרופיל מקצועי
          </span>
        </button>
      </div>

      <form id="join-form">
        <div class="form-grid">
          <div class="field">
            <label for="name">שם מלא</label>

            <input
              id="name"
              type="text"
              autocomplete="name"
              required
            >
          </div>

          <div class="field">
            <label for="email">כתובת דוא״ל</label>

            <input
              id="email"
              type="email"
              autocomplete="email"
              required
            >
          </div>

          <div class="field">
            <label for="subject" id="subject-label">
              מה רוצים ללמוד?
            </label>

            <input
              id="subject"
              type="text"
              placeholder="למשל: מתמטיקה"
              required
            >
          </div>

          <div class="field teacher-only" hidden>
            <label for="price">מחיר לשעה</label>

            <input
              id="price"
              type="number"
              min="0"
              placeholder="למשל: 120"
            >
          </div>

          <div class="field teacher-only" hidden>
            <label for="experience">ניסיון בהוראה</label>

            <input
              id="experience"
              type="text"
              placeholder="למשל: 4 שנות ניסיון"
            >
          </div>

          <div class="field teacher-only" hidden>
            <label for="format">אופן השיעור</label>

            <select id="format">
              <option value="אונליין">אונליין</option>
              <option value="פרונטלי">פרונטלי</option>
              <option value="גם וגם">גם וגם</option>
            </select>
          </div>

          <div class="field full">
            <label for="bio" id="bio-label">
              מה המטרה שלך?
            </label>

            <textarea
              id="bio"
              placeholder="ספרו לנו מה תרצו להשיג"
              required
            ></textarea>
          </div>
        </div>

        <div class="notice">
          פרופיל מורה חדש יסומן כ״ממתין לאימות״.
          לא נציג סימון של מורה מאומת לפני שיתקיים
          תהליך אימות אמיתי.
        </div>

        <button class="button teal" type="submit">
          שמירת הפרופיל ←
        </button>

        <div
          class="success"
          id="success"
          role="status"
        ></div>
      </form>
    </section>
  </main>

  <script>
    let selectedRole = "student";

    const roleButtons =
      document.querySelectorAll(".role-option");

    const teacherFields =
      document.querySelectorAll(".teacher-only");

    const subjectLabel =
      document.getElementById("subject-label");

    const bioLabel =
      document.getElementById("bio-label");

    const bioInput =
      document.getElementById("bio");

    roleButtons.forEach((button) => {
      button.addEventListener("click", () => {
        selectedRole = button.dataset.role;

        roleButtons.forEach((item) => {
          item.classList.toggle(
            "active",
            item === button
          );
        });

        const isTeacher =
          selectedRole === "teacher";

        teacherFields.forEach((field) => {
          field.hidden = !isTeacher;
        });

        subjectLabel.textContent = isTeacher
          ? "המקצוע העיקרי"
          : "מה רוצים ללמוד?";

        bioLabel.textContent = isTeacher
          ? "ספרו על הניסיון ושיטת ההוראה"
          : "מה המטרה שלך?";

        bioInput.placeholder = isTeacher
          ? "ספרו על הניסיון, ההכשרה והדרך שבה אתם מלמדים"
          : "ספרו לנו מה תרצו להשיג";
      });
    });

    document
      .getElementById("join-form")
      .addEventListener("submit", (event) => {
        event.preventDefault();

        const account = Kivun.create({
          role: selectedRole,

          name: document
            .getElementById("name")
            .value
            .trim(),

          email: document
            .getElementById("email")
            .value
            .trim(),

          subject: document
            .getElementById("subject")
            .value
            .trim(),

          price: selectedRole === "teacher"
            ? document.getElementById("price").value
            : "",

          experience: selectedRole === "teacher"
            ? document
                .getElementById("experience")
                .value
                .trim()
            : "",

          format: selectedRole === "teacher"
            ? document.getElementById("format").value
            : "",

          bio: document
            .getElementById("bio")
            .value
            .trim()
        });

        const successBox =
          document.getElementById("success");

        successBox.textContent =
          "הפרופיל נשמר בהצלחה. מעבירים אותך לאזור האישי…";

        successBox.classList.add("show");

        window.setTimeout(() => {
          if (account.role === "teacher") {
            window.location.href =
              "teacher-profile.html?id=" +
              encodeURIComponent(account.id);
          } else {
            window.location.href =
              "dashboard.html";
          }
        }, 700);
      });

    footer();
  </script>
</body>
</html>
