<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>צ׳אט — כיוון</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap');
    :root{--navy:#121a37;--ink:#1c2746;--teal:#0b9d78;--coral:#ff6e61;--cloud:#f6f8fe;--line:#e5eaf4;--muted:#69738d}
    *{box-sizing:border-box}
    body{margin:0;color:var(--ink);background:linear-gradient(135deg,#f7f9ff,#effcf8);font-family:Heebo,Arial,sans-serif}
    button,input,textarea{font:inherit}
    .hidden{display:none!important}
    header{height:76px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94)}
    .nav{width:min(1100px,calc(100% - 30px));height:100%;margin:auto;display:flex;align-items:center;justify-content:space-between}
    .brand{color:var(--navy);font-size:28px;font-weight:900;text-decoration:none}.brand span{color:var(--coral)}
    .back{color:var(--teal);font-weight:800;text-decoration:none}
    main{width:min(900px,calc(100% - 24px));margin:28px auto}
    .chat{height:calc(100vh - 132px);min-height:560px;display:grid;grid-template-rows:auto 1fr auto;border:1px solid var(--line);border-radius:24px;background:#fff;box-shadow:0 20px 55px rgba(18,26,55,.1);overflow:hidden}
    .chat-head{padding:17px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line)}
    .person{display:flex;align-items:center;gap:12px}.avatar{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;color:#fff;background:linear-gradient(135deg,var(--coral),#ef9281);font-size:21px;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}
    h1{margin:0;font-size:19px}.details{color:var(--muted);font-size:13px;font-weight:600}
    .safety-button{padding:9px 12px;border:1px solid #ffd0cc;border-radius:10px;color:#a5342e;background:#fff5f4;font-weight:800;cursor:pointer}
    .messages{padding:22px;overflow-y:auto;background:linear-gradient(#fbfcff,#f7f9fe);display:flex;flex-direction:column;gap:10px}
    .bubble{max-width:min(75%,560px);padding:10px 13px;border:1px solid var(--line);border-radius:15px 15px 5px 15px;background:#fff;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{align-self:flex-start;color:#fff;border-color:var(--teal);border-radius:15px 15px 15px 5px;background:var(--teal)}
    .time{display:block;margin-top:4px;color:#8d96aa;font-size:10px}.mine .time{color:#d6fff1}
    .empty,.loading{margin:auto;color:var(--muted);text-align:center;line-height:1.7}.empty b{display:block;color:var(--ink);font-size:18px}
    .composer{padding:14px;display:grid;grid-template-columns:1fr auto;gap:10px;border-top:1px solid var(--line)}
    .composer textarea{min-height:48px;max-height:120px;resize:none;padding:12px;border:1px solid var(--line);border-radius:13px;outline:0}.composer textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #dff7ed}
    .send{padding:0 22px;border:0;border-radius:13px;color:#fff;background:var(--navy);font-weight:900;cursor:pointer}.send:disabled{opacity:.55;cursor:not-allowed}
    .notice{padding:12px 18px;color:#765b09;background:#fff8de;font-size:13px;text-align:center}
    dialog{width:min(470px,calc(100% - 28px));padding:0;border:0;border-radius:20px;box-shadow:0 25px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(18,26,55,.55)}
    .modal{padding:22px}.modal h2{margin:0 0 8px}.modal p{color:var(--muted);line-height:1.6}.modal textarea{width:100%;min-height:95px;padding:11px;border:1px solid var(--line);border-radius:11px;resize:vertical}.actions{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}.actions button{padding:10px 14px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.report{color:#fff;background:#b43b34}.block{color:#9e2f2a;background:#fff0ef}.cancel{color:var(--ink);background:#eef1f7}
    @media(max-width:600px){header{height:64px}.brand{font-size:23px}main{width:100%;margin:0}.chat{height:calc(100vh - 64px);min-height:0;border:0;border-radius:0}.chat-head{padding:12px}.messages{padding:14px}.bubble{max-width:86%}.safety-button{padding:7px 9px;font-size:12px}.composer{padding:10px}.send{padding:0 15px}}
  </style>
</head>
<body>
  <header><div class="nav"><a class="brand" href="index.html">כיוון<span>↗</span></a><a class="back" href="dashboard.html">חזרה לאזור האישי</a></div></header>
  <main>
    <section class="chat">
      <div class="chat-head">
        <div class="person"><div class="avatar" id="avatar">כ</div><div><h1 id="person-name">טוענים שיחה...</h1><div class="details" id="request-details"></div></div></div>
        <button class="safety-button hidden" id="safety-button" type="button">דיווח או חסימה</button>
      </div>
      <div class="messages" id="messages"><div class="loading">טוענים את השיחה...</div></div>
      <div>
        <div class="notice">שמרו על שיחה מכבדת. אל תשלחו כתובת, סיסמה, פרטי תשלום או תמונות אישיות.</div>
        <form class="composer" id="composer"><textarea id="message-input" maxlength="1000" required placeholder="כתבו הודעה..."></textarea><button class="send" id="send-button" type="submit">שליחה</button></form>
      </div>
    </section>
  </main>

  <dialog id="safety-dialog">
    <div class="modal">
      <h2>בטיחות בשיחה</h2>
      <p>אם משהו גרם לך אי־נוחות, אפשר לדווח ולחסום מיד. לאחר חסימה אף צד לא יוכל לשלוח הודעות חדשות.</p>
      <textarea id="report-reason" maxlength="800" placeholder="מה קרה? אפשר לכתוב במילים שלך (לא חובה לחסימה)"></textarea>
      <div class="actions"><button class="report" id="report-button" type="button">שליחת דיווח</button><button class="block" id="block-button" type="button">חסימת השיחה</button><button class="cancel" id="cancel-button" type="button">ביטול</button></div>
    </div>
  </dialog>

  <script type="module">
    import{auth,db,onAuthStateChanged,doc,getDoc,setDoc,addDoc,collection,query,orderBy,onSnapshot,serverTimestamp}from"./firebase.js";
    const requestId=new URLSearchParams(location.search).get("id");
    const messagesBox=document.getElementById("messages");
    const composer=document.getElementById("composer");
    const input=document.getElementById("message-input");
    const sendButton=document.getElementById("send-button");
    const safetyButton=document.getElementById("safety-button");
    const dialog=document.getElementById("safety-dialog");
    let user=null,request=null,unsubscribe=null,blocked=false;

    const safe=value=>String(value??"").replace(/[&<>'"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[char]);
    function fail(text){messagesBox.innerHTML=`<div class="empty"><b>לא ניתן לפתוח את הצ׳אט</b>${safe(text)}</div>`;composer.classList.add("hidden");safetyButton.classList.add("hidden")}
    function timeText(value){if(!value?.toDate)return "עכשיו";return value.toDate().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})}
    function setBlocked(value){blocked=value;input.disabled=value;sendButton.disabled=value;if(value){input.placeholder="השיחה חסומה ולא ניתן לשלוח הודעות";document.querySelector(".notice").textContent="השיחה נחסמה. ההודעות הקיימות נשמרו לצורך בדיקה."}}
    async function watchBlocks(){const ids=[`${requestId}_${request.studentId}`,`${requestId}_${request.teacherId}`];ids.forEach(id=>onSnapshot(doc(db,"blocks",id),snap=>{if(snap.exists())setBlocked(true)}))}
    function watchMessages(){const messagesQuery=query(collection(db,"requests",requestId,"messages"),orderBy("createdAt","asc"));unsubscribe=onSnapshot(messagesQuery,snapshot=>{if(snapshot.empty){messagesBox.innerHTML='<div class="empty"><b>הצ׳אט מוכן</b>אפשר להתחיל לדבר על השיעור. אל תשתפו פרטים אישיים שלא נחוצים.</div>';return}messagesBox.innerHTML=snapshot.docs.map(item=>{const data=item.data();return `<div class="bubble ${data.senderId===user.uid?"mine":""}">${safe(data.text)}<span class="time">${safe(timeText(data.createdAt))}</span></div>`}).join("");messagesBox.scrollTop=messagesBox.scrollHeight},error=>{console.error(error);fail("לא הצלחנו לטעון את ההודעות.")})}
    async function start(){if(!requestId){fail("חסר מספר בקשה.");return}const snap=await getDoc(doc(db,"requests",requestId));if(!snap.exists()){fail("הבקשה לא נמצאה.");return}request={id:snap.id,...snap.data()};if(![request.studentId,request.teacherId].includes(user.uid)){fail("השיחה זמינה רק לתלמיד/ה ולמורה שבבקשה.");return}if(request.status!=="accepted"){fail("הצ׳אט נפתח רק אחרי שהמורה מאשר/ת את הבקשה.");return}const viewingAsStudent=user.uid===request.studentId;const otherId=viewingAsStudent?request.teacherId:request.studentId;const otherName=viewingAsStudent?request.teacherName:request.studentName;document.getElementById("person-name").textContent=otherName||"משתמש/ת בכיוון";document.getElementById("request-details").textContent=[request.subject,request.preferredTime].filter(Boolean).join(" · ");let other={};if(viewingAsStudent){try{const teacherSnap=await getDoc(doc(db,"teachers",otherId));if(teacherSnap.exists())other=teacherSnap.data()}catch(error){console.error(error)}}const avatar=document.getElementById("avatar");if(other.photo?.startsWith("data:image/")){avatar.innerHTML=`<img src="${other.photo}" alt="תמונת פרופיל">`}else{avatar.textContent=(otherName||"כ").charAt(0)}safetyButton.classList.remove("hidden");watchBlocks();watchMessages()}
    composer.addEventListener("submit",async event=>{event.preventDefault();const text=input.value.trim();if(!text||blocked)return;sendButton.disabled=true;try{await addDoc(collection(db,"requests",requestId,"messages"),{senderId:user.uid,text,createdAt:serverTimestamp()});input.value=""}catch(error){console.error(error);alert("לא הצלחנו לשלוח. ייתכן שהשיחה נחסמה.")}finally{sendButton.disabled=blocked}});
    input.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();composer.requestSubmit()}});
    safetyButton.addEventListener("click",()=>dialog.showModal());document.getElementById("cancel-button").addEventListener("click",()=>dialog.close());
    document.getElementById("report-button").addEventListener("click",async()=>{const reason=document.getElementById("report-reason").value.trim();if(!reason){alert("כתבו בקצרה מה קרה כדי שנוכל לבדוק.");return}await addDoc(collection(db,"reports"),{requestId,reporterId:user.uid,reportedUserId:user.uid===request.studentId?request.teacherId:request.studentId,reason,status:"open",createdAt:serverTimestamp()});dialog.close();alert("הדיווח התקבל. תודה שסיפרת לנו.")});
    document.getElementById("block-button").addEventListener("click",async()=>{if(!confirm("לחסום את השיחה? לאחר מכן אף צד לא יוכל לשלוח הודעות."))return;await setDoc(doc(db,"blocks",`${requestId}_${user.uid}`),{requestId,blockedBy:user.uid,blockedUserId:user.uid===request.studentId?request.teacherId:request.studentId,createdAt:serverTimestamp()});setBlocked(true);dialog.close()});
    onAuthStateChanged(auth,async current=>{if(!current){location.href="login.html";return}user=current;try{await start()}catch(error){console.error(error);fail("אירעה שגיאה בפתיחת השיחה.")}});
    addEventListener("beforeunload",()=>unsubscribe?.());
  </script>
</body>
</html>
