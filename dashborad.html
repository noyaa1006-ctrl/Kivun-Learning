<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>האזור שלי — כיוון</title>

  <link rel="stylesheet" href="styles.css">
  <script src="app.js"></script>
</head>

<body>
  <script>
    nav("dashboard");
  </script>

  <main class="container">
    <header class="page-head">
      <span class="eyebrow">החשבון שלי</span>

      <h1>האזור שלי</h1>

      <p class="muted">
        צפייה ועדכון של הפרופיל שנוצר במכשיר הזה.
      </p>
    </header>

    <section id="dashboard"></section>
  </main>

  <script>
    const account = Kivun.current();

    const dashboard =
      document.getElementById("dashboard");

    if (!account) {
      dashboard.innerHTML = `
        <div class="card empty">
          <div class="empty-icon">◎</div>

          <h2>עדיין אין כאן פרופיל</h2>

          <p class="muted">
            פתחו פרופיל כדי לגשת לאזור האישי
            ולשמור את הפרטים שלכם.
          </p>

          <a class="button teal" href="join.html">
            לפתיחת פרופיל
          </a>
        </div>
      `;
    } else {
      const name = Kivun.esc(
        account.name
      );

      const email = Kivun.esc(
        account.email
      );

      const subject = Kivun.esc(
        account.subject
      );

      const bio = Kivun.esc(
        account.bio
      );

      const experience = Kivun.esc(
        account.experience || ""
      );

      const price = Kivun.esc(
        account.price || ""
      );

      const isTeacher =
        account.role === "teacher";

      const publicProfileLink =
        "teacher-profile.html?id=" +
        encodeURIComponent(account.id);

      dashboard.innerHTML = `
        <div class="dashboard">
          <aside class="card side">
            <a href="dashboard.html">
              עריכת הפרופיל
            </a>

            <a href="matches.html">
              המורים באתר
            </a>

            ${
              isTeacher
                ? `
                  <a href="${publicProfileLink}">
                    הפרופיל הציבורי שלי
                  </a>
                `
                : ""
            }

            <a href="index.html">
              עמוד הבית
            </a>
          </aside>

          <section class="card">
            <div class="profile-head">
              <div class="avatar">
                ${Kivun.esc(name.charAt(0))}
              </div>

              <div>
                <h2>${name}</h2>

                <p class="muted">
                  ${
                    isTeacher
                      ? "פרופיל מורה"
                      : "פרופיל תלמיד/ה או הורה"
                  }
                </p>
              </div>
            </div>

            <form id="edit-form">
              <div class="form-grid">
                <div class="field">
                  <label for="edit-name">
                    שם מלא
                  </label>

                  <input
                    id="edit-name"
                    type="text"
                    value="${name}"
                    required
                  >
                </div>

                <div class="field">
                  <label for="edit-email">
                    כתובת דוא״ל
                  </label>

                  <input
                    id="edit-email"
                    type="email"
                    value="${email}"
                    required
                  >
                </div>

                <div class="field">
                  <label for="edit-subject">
                    ${
                      isTeacher
                        ? "המקצוע העיקרי"
                        : "מה רוצים ללמוד?"
                    }
                  </label>

                  <input
                    id="edit-subject"
                    type="text"
                    value="${subject}"
                    required
                  >
                </div>

                ${
                  isTeacher
                    ? `
                      <div class="field">
                        <label for="edit-price">
                          מחיר לשעה
                        </label>

                        <input
                          id="edit-price"
                          type="number"
                          min="0"
                          value="${price}"
                        >
                      </div>

                      <div class="field full">
                        <label for="edit-experience">
                          ניסיון בהוראה
                        </label>

                        <input
                          id="edit-experience"
                          type="text"
                          value="${experience}"
                        >
                      </div>
                    `
                    : ""
                }

                <div class="field full">
                  <label for="edit-bio">
                    ${
                      isTeacher
                        ? "ניסיון ושיטת ההוראה"
                        : "המטרה שלך"
                    }
                  </label>

                  <textarea
                    id="edit-bio"
                    required
                  >${bio}</textarea>
                </div>
              </div>

              <button
                class="button teal"
                type="submit"
              >
                שמירת השינויים
              </button>

              ${
                isTeacher
                  ? `
                    <a
                      class="button light"
                      href="${publicProfileLink}"
                    >
                      צפייה בפרופיל הציבורי
                    </a>
                  `
                  : ""
              }

              <div
                class="success"
                id="saved"
                role="status"
              >
                השינויים נשמרו בהצלחה.
              </div>
            </form>
          </section>
        </div>
      `;

      document
        .getElementById("edit-form")
        .addEventListener("submit", (event) => {
          event.preventDefault();

          const updatedData = {
            name: document
              .getElementById("edit-name")
              .value
              .trim(),

            email: document
              .getElementById("edit-email")
              .value
              .trim(),

            subject: document
              .getElementById("edit-subject")
              .value
              .trim(),

            bio: document
              .getElementById("edit-bio")
              .value
              .trim()
          };

          if (isTeacher) {
            updatedData.price =
              document
                .getElementById("edit-price")
                .value;

            updatedData.experience =
              document
                .getElementById("edit-experience")
                .value
                .trim();
          }

          Kivun.update(updatedData);

          document
            .getElementById("saved")
            .classList
            .add("show");
        });
    }

    footer();
  </script>
</body>
</html>
